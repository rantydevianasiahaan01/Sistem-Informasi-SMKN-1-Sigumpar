# Alur produksi:
#   browser
#     → https://smkn1sigumpar.sch.id  (nginx HOST, TLS)
#     → http://127.0.0.1:8201                 (API gateway Docker)
#     → frontend / Keycloak /kc / API
#
# Wajib: SATU location / ke 8201. Jangan location /auth ke Keycloak lain.
# Header X-Forwarded-Proto harus https supaya login cookie Keycloak benar.

server {
    listen 443 ssl http2;
    server_name smkn1sigumpar.sch.id;

    # ssl_certificate     /path/ke/fullchain.pem;
    # ssl_certificate_key /path/ke/privkey.pem;

    client_max_body_size 50M;
    client_header_buffer_size 5m;
    large_client_header_buffers 4 5m;

    location / {
        proxy_pass http://127.0.0.1:8201;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;
        # Wajib di location yang proxy_pass. Tanpa ini: 502 "upstream sent too big header"
        # (cookie Keycloak). Cek: sudo nginx -T | grep proxy_buffer_size
        proxy_buffer_size 5m;
        proxy_buffers 4 5m;
        proxy_busy_buffers_size 10m;
    }
}

server {
    listen 80;
    server_name smkn1sigumpar.sch.id;
    return 301 https://$host$request_uri;
}
