worker_processes auto;

events {
    worker_connections 1024;
}

http {
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;
    client_max_body_size 50M;

    # Buffer di bawah ini dialokasikan PER KONEKSI. Nilai sebelumnya 5m, yang
    # dengan worker_connections 1024 berarti satu worker bisa meminta beberapa
    # GB hanya untuk membaca header — dan siapa pun bisa memicunya dengan
    # membuka banyak koneksi. Angka besar itu dulu dipasang karena Keycloak
    # mengirim header besar; location /kc/ sudah punya setelan buffernya
    # sendiri, jadi tidak ada yang pecah dengan nilai wajar di sini.
    client_header_buffer_size 1k;
    # Sedikit di atas default 8k: cookie sesi Keycloak bisa panjang, dan
    # header yang tidak muat dibalas 400 "Request Header Or Cookie Too Large".
    large_client_header_buffers 4 16k;

    sendfile on;
    keepalive_timeout 65;

    gzip on;
    # Tanpa gzip_proxied, nginx tidak mengompresi respons yang datang dari
    # upstream — dan di sini semua respons datang dari upstream, jadi kompresi
    # sebelumnya praktis tidak pernah jalan.
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1000;
    gzip_types
        application/javascript
        text/javascript
        application/json
        text/css
        text/plain
        image/svg+xml
        application/xml;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    # max_size dan inactive: tanpa keduanya cache tumbuh tanpa batas.
    proxy_cache_path /var/cache/nginx keys_zone=token_cache:10m
                     max_size=64m inactive=10m;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # Sebelumnya tiap location menyimpan alamat backend ke sebuah variabel lalu
    # proxy_pass ke variabel itu. Variabel di proxy_pass mematikan keepalive,
    # jadi setiap request membuka koneksi TCP baru ke Node lalu menutupnya.
    #
    # Pola itu dipakai supaya nginx tetap mau start walau ada container yang
    # belum hidup. Sejak nginx 1.27.3 parameter `resolve` pada server di dalam
    # blok upstream memberi sifat yang sama, jadi dua-duanya bisa didapat.
    upstream auth_service {
        zone auth_service 64k;
        server external-pkm-smkn1-sigumpar-auth-service:3005 resolve;
        keepalive 16;
    }

    upstream academic_service {
        zone academic_service 64k;
        server external-pkm-smkn1-sigumpar-academic-service:3003 resolve;
        keepalive 16;
    }

    upstream learning_service {
        zone learning_service 64k;
        server external-pkm-smkn1-sigumpar-learning-service:3006 resolve;
        keepalive 16;
    }

    upstream student_service {
        zone student_service 64k;
        server external-pkm-smkn1-sigumpar-student-service:3008 resolve;
        keepalive 16;
    }

    upstream vocational_service {
        zone vocational_service 64k;
        server external-pkm-smkn1-sigumpar-vocational-service:3007 resolve;
        keepalive 16;
    }

    upstream frontend_service {
        zone frontend_service 64k;
        server external-pkm-smkn1-sigumpar-frontend:5173 resolve;
        keepalive 8;
    }

    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    # Tanpa map ini, location / memasang Connection: upgrade di SEMUA request,
    # sehingga koneksi keepalive ke frontend tidak pernah dipakai ulang.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      "";
    }

    map $forwarded_proto $forwarded_port {
        https   443;
        default $server_port;
    }

    server {
        listen 80;
        server_name _;

        # Header keamanan dasar. `always` supaya ikut terpasang pada respons
        # error (401/403/404), bukan cuma pada 2xx.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # 'self', bukan 'none'. Aplikasi menampilkan PDF hasil unduhan di dalam
        # <iframe src="blob:..."> — dokumen blob mewarisi CSP halaman induknya,
        # sehingga 'none' membuat pratinjau dokumen tidak pernah muncul dan
        # pengguna terpaksa mengunduh dulu. 'self' tetap menghalangi situs lain
        # membingkai aplikasi ini, yang memang tujuan header ini.
        add_header Content-Security-Policy "frame-ancestors 'self'" always;

        # CORS sengaja tidak dipasang. Frontend dan API dilayani dari origin yang
        # sama — frontend memakai window.location.origin — jadi tidak ada request
        # lintas-origin yang sah, dan request same-origin tidak pernah preflight.
        #
        # Sebelumnya di sini ada Access-Control-Allow-Origin: * untuk SEMUA
        # respons termasuk API. Selama token dikirim lewat header Authorization
        # itu belum fatal, tapi berubah jadi lubang sungguhan begitu refresh
        # token pindah ke cookie httpOnly. Kalau suatu saat memang butuh akses
        # lintas-origin, pasang origin yang spesifik, bukan bintang.

        location /health {
            return 200 '{"status":"OK","service":"api-gateway"}';
            add_header Content-Type application/json;
        }

        location = /auth-verify {
            internal;
            proxy_pass http://auth_service/api/auth/verify;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_cache token_cache;
            proxy_cache_key "$http_authorization";
            # Sepuluh request bersamaan dengan token sama sebelumnya jadi sepuluh
            # subrequest ke auth-service; dengan cache_lock hanya satu yang jalan.
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;
            # 60 detik, bukan 5 menit: akun yang baru dinonaktifkan tidak boleh
            # tetap bisa dipakai selama lima menit setelahnya.
            proxy_cache_valid 200 60s;
            proxy_cache_valid 401 403 0s;
        }

        location = /error401 {
            default_type application/json;
            return 401 '{"error":"Unauthorized","message":"Token tidak valid atau tidak ditemukan"}';
        }

        location = /error403 {
            default_type application/json;
            return 403 '{"error":"Forbidden","message":"Akses ditolak"}';
        }

        location /api/auth/uploads/ {
            rewrite ^/api/auth/uploads/(.*)$ /uploads/$1 break;
            proxy_pass http://auth_service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location /api/auth {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://auth_service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location /uploads/ {
            # Lampiran arsip surat. Satu-satunya jalur uploads yang seluruh
            # pemakainya memakai fetch/axios, jadi bisa dipasangi verifikasi.
            # Jalur */uploads/ lainnya dimuat lewat <img src> yang tidak bisa
            # mengirim header Authorization — lihat catatan di bawah.
            auth_request /auth-verify;
            error_page 401 =401 /error401;
            error_page 403 =403 /error403;

            proxy_pass http://academic_service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/academic/uploads/ {
            # Jalur kedua ke lampiran arsip surat. Tidak dipakai frontend, tapi
            # kalau dibiarkan terbuka verifikasi di location /uploads/ percuma.
            auth_request /auth-verify;
            error_page 401 =401 /error401;
            error_page 403 =403 /error403;

            rewrite ^/api/academic/uploads/(.*)$ /uploads/$1 break;
            proxy_pass http://academic_service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location /api/student/uploads/ {
            rewrite ^/api/student/uploads/(.*)$ /uploads/$1 break;
            proxy_pass http://student_service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location /api/vocational/uploads/ {
            rewrite ^/api/vocational/uploads/(.*)$ /uploads/$1 break;
            proxy_pass http://vocational_service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location /api/academic {
            auth_request /auth-verify;
            error_page 401 =401 /error401;
            error_page 403 =403 /error403;

            auth_request_set $auth_user_id   $upstream_http_x_user_id;
            auth_request_set $auth_user_role $upstream_http_x_user_role;

            proxy_set_header X-User-Id    $auth_user_id;
            proxy_set_header X-User-Role  $auth_user_role;
            proxy_set_header Authorization $http_authorization;

            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://academic_service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location /api/learning {
            auth_request /auth-verify;
            error_page 401 =401 /error401;
            error_page 403 =403 /error403;

            auth_request_set $auth_user_id   $upstream_http_x_user_id;
            auth_request_set $auth_user_role $upstream_http_x_user_role;

            proxy_set_header X-User-Id    $auth_user_id;
            proxy_set_header X-User-Role  $auth_user_role;
            proxy_set_header Authorization $http_authorization;

            limit_req zone=api_limit burst=40 nodelay;
            proxy_pass http://learning_service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location /api/student {
            auth_request /auth-verify;
            error_page 401 =401 /error401;
            error_page 403 =403 /error403;

            proxy_set_header Authorization $http_authorization;

            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://student_service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location /api/vocational {
            auth_request /auth-verify;
            error_page 401 =401 /error401;
            error_page 403 =403 /error403;

            auth_request_set $auth_user_id   $upstream_http_x_user_id;
            auth_request_set $auth_user_role $upstream_http_x_user_role;

            proxy_set_header X-User-Id    $auth_user_id;
            proxy_set_header X-User-Role  $auth_user_role;
            proxy_set_header Authorization $http_authorization;

            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://vocational_service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location / {
            proxy_pass http://frontend_service;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}