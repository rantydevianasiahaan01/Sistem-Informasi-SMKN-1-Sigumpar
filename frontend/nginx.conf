server {
    listen 5173;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Berkas hasil build bernama pakai hash isi, jadi aman di-cache selamanya.
    # Yang penting: kalau berkasnya TIDAK ada, balas 404 — jangan jatuh ke
    # index.html. Tanpa ini, browser yang memegang index.html lama meminta
    # bundle lama, menerima HTML berstatus 200, lalu mencoba menjalankannya
    # sebagai JavaScript — dan seluruh aplikasi mati tanpa pesan yang jelas.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Sebaliknya, shell-nya tidak boleh di-cache sama sekali: di sinilah nama
    # bundle terbaru tertulis.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}