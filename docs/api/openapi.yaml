openapi: 3.0.3
info:
  title: API Sprint 4 SMKN 1 Sigumpar (Input Nilai, BK, PKL)
  version: 0.1.0
  description: |
    Kontrak REST API antara front end dan back end untuk halaman Sprint 4.
    Konvensi umum ada di `docs/api/README.md`, aturan bisnis di `docs/keputusan.md`.

    **Autentikasi.** Semua endpoint memakai header `Authorization: Bearer <token>`
    (diurus `axiosInstance` di front end). Service membaca identitas dari token:
    `sub` = id akun (UUID), `realm_access.roles` = role.

    **Role.** Ditulis per endpoint di `x-roles`. Role lain mendapat 403.

    **Pengampu.** Di skema yang berjalan (K-41), satu baris `mata_pelajaran` berisi
    mapel + kelas + guru, jadi baris itu berperan sebagai "pengampu". Endpoint
    Input Nilai memakai `mapel_id` (= `mata_pelajaran.id`) sebagai id pengampu.

    **Tahun ajaran.** Parameter `tahun_ajaran_id` selalu opsional; jika tidak
    dikirim dipakai tahun ajaran yang aktif.

    **Nilai kosong** dikirim dan diterima sebagai `null`, bukan 0 (K-02).

    Endpoint bertanda **(baru)** belum ada sebelum Sprint 4. Endpoint lama yang
    sudah dipakai halaman lain tetap berlaku dan tidak diubah.
servers:
  - url: http://localhost:8001
    description: Lokal lewat api-gateway
security:
  - bearerAuth: []
tags:
  - name: Input Nilai
    description: Halaman Input Nilai guru mapel (Figma "fitur guru mapel - input nilai & Rekap")
  - name: BK - Pendukung
    description: Pencarian dan profil siswa untuk modul BK
  - name: BK - Pemanggilan Orang Tua
    description: PB-01 (Figma "fitur BK - pemanggilan orang tua")
  - name: BK - Pendampingan & Pembinaan
    description: PB-02 (Figma "fitur BK - Pendampingan & Pembinaan Orang Tua")
  - name: BK - Pengembalian Siswa
    description: PB-03 (Figma "fitur BK - Pengembalian mahasiswa")
  - name: BK - Lampiran
    description: Bukti kegiatan BK, maks 5 MB (K-12)
  - name: BK - Surat
    description: Surat dari template, pratinjau, dan arsip read-only (K-11, PB-08)
  - name: PKL
    description: Penempatan dan riwayat perpindahan lokasi PKL (Figma "Menu PKL"). API perpindahan dikerjakan Sprint 5.

paths:
  # =====================================================================
  # INPUT NILAI (student-service)
  # =====================================================================
  /api/student/nilai/pengampu:
    get:
      tags: [Input Nilai]
      summary: (baru) Daftar mapel + kelas yang diampu guru yang login
      description: Isi dropdown Mapel dan Kelas di halaman Input Nilai.
      x-roles: [guru-mapel]
      parameters:
        - $ref: '#/components/parameters/TahunAjaranId'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Sukses'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Pengampu' }
              example:
                success: true
                message: Daftar pengampu
                data:
                  - { mapel_id: 12, nama_mapel: Informatika, kelas_id: 3, nama_kelas: X TKJ 1, tahun_ajaran_id: 1, tahun_ajaran: 2026/2027, jumlah_siswa: 32 }
        '401': { $ref: '#/components/responses/BelumLogin' }
        '403': { $ref: '#/components/responses/TidakBerhak' }

  /api/student/nilai/pengampu/{mapel_id}:
    parameters:
      - $ref: '#/components/parameters/MapelId'
    get:
      tags: [Input Nilai]
      summary: (baru) Tabel nilai satu pengampu dan semester
      description: |
        Siswa aktif di kelas beserta nilai komponen, nilai tiap penilaian harian
        (kolom P1, P2, ...), rata-rata Harian, nilai perilaku, dan nilai akhir.
        Nilai akhir dihitung dengan rumus K-02: komponen `null` tidak dihitung dan
        bobotnya tidak ikut pembagi. Perilaku baru dihitung bila konversi A-E
        lengkap (K-04). Jika bobot belum diatur, dipakai bobot default K-03 dan
        `bobot_default = true`.
      x-roles: [guru-mapel]
      parameters:
        - $ref: '#/components/parameters/SemesterWajib'
        - $ref: '#/components/parameters/TahunAjaranId'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Sukses'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TabelNilai' }
              example:
                success: true
                message: Tabel nilai
                data:
                  pengampu: { mapel_id: 12, nama_mapel: Informatika, kelas_id: 3, nama_kelas: X TKJ 1, tahun_ajaran_id: 1, tahun_ajaran: 2026/2027, jumlah_siswa: 32 }
                  semester: ganjil
                  bobot: { bobot_harian: 10, bobot_tugas: 10, bobot_kuis: 10, bobot_uts: 20, bobot_uas: 25, bobot_praktik: 15, bobot_perilaku: 10 }
                  bobot_default: true
                  konversi_perilaku: [{ predikat: A, nilai_angka: 95 }, { predikat: B, nilai_angka: 85 }, { predikat: C, nilai_angka: 75 }, { predikat: D, nilai_angka: 65 }, { predikat: E, nilai_angka: 55 }]
                  konversi_perilaku_lengkap: true
                  penilaian_harian: [{ id: 7, urutan: 1, kode: P1, judul: UH Bab 1, jenis: ulangan_harian, tanggal: '2026-11-20', keterangan: null }]
                  siswa:
                    - siswa_id: 101
                      nisn: '0081234567'
                      nama_lengkap: Andreas Sinaga
                      nilai_id: 55
                      tugas: 80
                      kuis: 85
                      uts: 78
                      uas: 82
                      praktik: 88
                      predikat_perilaku: B
                      nilai_harian: [{ penilaian_harian_id: 7, nilai: 70 }]
                      rata_harian: 70
                      nilai_perilaku: 85
                      nilai_akhir: 81.3
                    - siswa_id: 102
                      nisn: '0081234568'
                      nama_lengkap: Debora Panjaitan
                      nilai_id: null
                      tugas: null
                      kuis: null
                      uts: null
                      uas: null
                      praktik: null
                      predikat_perilaku: null
                      nilai_harian: [{ penilaian_harian_id: 7, nilai: null }]
                      rata_harian: null
                      nilai_perilaku: null
                      nilai_akhir: null
        '400': { $ref: '#/components/responses/InputTidakValid' }
        '401': { $ref: '#/components/responses/BelumLogin' }
        '403': { $ref: '#/components/responses/TidakBerhak' }
        '404': { $ref: '#/components/responses/PengampuTidakAda' }
    put:
      tags: [Input Nilai]
      summary: (baru) Simpan nilai komponen banyak siswa sekaligus
      description: |
        - Hanya kolom yang dikirim yang diubah (boleh mengirim satu kolom saja, mis. `uts`).
        - `null` = belum dinilai, bukan 0 (K-02). Nilai angka 0-100.
        - Siswa harus terdaftar aktif di kelas pengampu.
        - Satu transaksi: jika satu baris tidak valid, tidak ada yang tersimpan.
        - Setiap perubahan dicatat ke `riwayat_nilai` (dipakai halaman Riwayat, K-05).
      x-roles: [guru-mapel]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SimpanNilaiRequest' }
            example:
              semester: ganjil
              nilai:
                - { siswa_id: 101, tugas: 80, kuis: 85, uts: 78, uas: null, praktik: 88, predikat_perilaku: B }
                - { siswa_id: 102, uts: 55 }
      responses:
        '200':
          description: Tersimpan. `data` berisi baris nilai terbaru siswa yang dikirim.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Sukses'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/BarisNilai' }
              example:
                success: true
                message: Nilai 2 siswa disimpan (8 perubahan tercatat)
                data:
                  - { siswa_id: 101, nilai_id: 55, tugas: 80, kuis: 85, uts: 78, uas: null, praktik: 88, predikat_perilaku: B, rata_harian: null, nilai_perilaku: 85, nilai_akhir: 82.77 }
        '400':
          description: Input tidak valid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Gagal' }
              examples:
                rentang: { value: { success: false, message: 'Baris 1: uts harus angka 0 sampai 100' } }
                bukan_anggota: { value: { success: false, message: Siswa 999 tidak terdaftar aktif di kelas ini } }
                predikat: { value: { success: false, message: 'Baris 1: predikat_perilaku harus salah satu dari A, B, C, D, E' } }
        '401': { $ref: '#/components/responses/BelumLogin' }
        '403': { $ref: '#/components/responses/TidakBerhak' }
        '404': { $ref: '#/components/responses/PengampuTidakAda' }

  /api/student/nilai/pengampu/{mapel_id}/bobot:
    parameters:
      - $ref: '#/components/parameters/MapelId'
    put:
      tags: [Input Nilai]
      summary: (baru) Simpan bobot komponen (panel Atur Bobot)
      description: Ketujuh bobot wajib dikirim, masing-masing 0-100, total tepat 100 (K-03). Bobot berlaku per pengampu dan semester.
      x-roles: [guru-mapel]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BobotRequest' }
            example: { semester: ganjil, bobot_harian: 10, bobot_tugas: 10, bobot_kuis: 10, bobot_uts: 20, bobot_uas: 25, bobot_praktik: 15, bobot_perilaku: 10 }
      responses:
        '200':
          description: Tersimpan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Sukses'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Bobot' }
        '400':
          description: Input tidak valid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Gagal' }
              example: { success: false, message: 'Total bobot harus 100, sekarang 95' }
        '401': { $ref: '#/components/responses/BelumLogin' }
        '403': { $ref: '#/components/responses/TidakBerhak' }
        '404': { $ref: '#/components/responses/PengampuTidakAda' }

  /api/student/nilai/pengampu/{mapel_id}/konversi-perilaku:
    parameters:
      - $ref: '#/components/parameters/MapelId'
    put:
      tags: [Input Nilai]
      summary: (baru) Simpan konversi nilai perilaku A-E (modal Konversi Nilai Perilaku)
      description: |
        Diisi guru, tanpa persetujuan Waka/Kepsek (K-04). Kelima predikat wajib
        dikirim sekaligus dan urutannya tidak boleh terbalik (A >= B >= C >= D >= E).
        Berlaku untuk pengampu pada tahun ajaran itu (kedua semester).
      x-roles: [guru-mapel]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KonversiRequest' }
            example: { A: 95, B: 85, C: 75, D: 65, E: 55 }
      responses:
        '200':
          description: Tersimpan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Sukses'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Konversi' }
        '400':
          description: Input tidak valid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Gagal' }
              examples:
                kurang: { value: { success: false, message: Nilai predikat E wajib diisi } }
                terbalik: { value: { success: false, message: Nilai predikat B tidak boleh lebih tinggi dari A } }
        '401': { $ref: '#/components/responses/BelumLogin' }
        '403': { $ref: '#/components/responses/TidakBerhak' }
        '404': { $ref: '#/components/responses/PengampuTidakAda' }

  /api/student/nilai/pengampu/{mapel_id}/harian:
    parameters:
      - $ref: '#/components/parameters/MapelId'
    get:
      tags: [Input Nilai]
      summary: (baru) Daftar penilaian harian (P1, P2, ...)
      x-roles: [guru-mapel]
      parameters:
        - $ref: '#/components/parameters/SemesterWajib'
        - $ref: '#/components/parameters/TahunAjaranId'
      responses:
        '200':
          description: Berhasil (array kosong = state kosong "belum ada penilaian harian")
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Sukses'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          allOf:
                            - $ref: '#/components/schemas/PenilaianHarian'
                            - type: object
                              properties:
                                jumlah_dinilai: { type: integer, example: 30 }
                                rata_kelas: { type: number, nullable: true, example: 78.4 }
        '400': { $ref: '#/components/responses/InputTidakValid' }
        '401': { $ref: '#/components/responses/BelumLogin' }
        '403': { $ref: '#/components/responses/TidakBerhak' }
        '404': { $ref: '#/components/responses/PengampuTidakAda' }
    post:
      tags: [Input Nilai]
      summary: (baru) Tambah kolom penilaian harian (tombol "+ Tambah")
      description: Sistem tambah (K-01). Nomor urut (P1, P2, ...) diberikan otomatis = nomor terbesar + 1.
      x-roles: [guru-mapel]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PenilaianHarianRequest' }
            example: { semester: ganjil, judul: UH Bab 1, jenis: ulangan_harian, tanggal: '2026-11-20', keterangan: null }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Sukses'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PenilaianHarian' }
              example:
                success: true
                message: Penilaian P1 dibuat
                data: { id: 7, urutan: 1, kode: P1, judul: UH Bab 1, jenis: ulangan_harian, tanggal: '2026-11-20', keterangan: null }
        '400': { $ref: '#/components/responses/InputTidakValid' }
        '401': { $ref: '#/components/responses/BelumLogin' }
        '403': { $ref: '#/components/responses/TidakBerhak' }
        '404': { $ref: '#/components/responses/PengampuTidakAda' }

  /api/student/nilai/harian/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Input Nilai]
      summary: (baru) Satu penilaian harian beserta nilai semua siswa
      x-roles: [guru-mapel]
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Sukses'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PenilaianHarian'
                          - type: object
                            properties:
                              siswa:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    siswa_id: { type: integer }
                                    nisn: { type: string }
                                    nama_lengkap: { type: string }
                                    nilai: { type: number, nullable: true }
        '401': { $ref: '#/components/responses/BelumLogin' }
        '403': { $ref: '#/components/responses/TidakBerhak' }
        '404': { $ref: '#/components/responses/TidakDitemukan' }
    put:
      tags: [Input Nilai]
      summary: (baru) Isi nilai dan/atau ubah judul, jenis, tanggal penilaian harian
      description: |
        Semua bagian opsional, minimal satu. `nilai: null` = siswa tidak ikut,
        tidak dihitung di rata-rata Harian. Siswa yang tidak dikirim tidak diubah.
      x-roles: [guru-mapel]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                judul: { type: string, maxLength: 150 }
                jenis: { $ref: '#/components/schemas/JenisHarian' }
                tanggal: { type: string, format: date }
                keterangan: { type: string, nullable: true }
                nilai:
                  type: array
                  maxItems: 200
                  items:
                    type: object
                    required: [siswa_id, nilai]
                    properties:
                      siswa_id: { type: integer }
                      nilai: { type: number, minimum: 0, maximum: 100, nullable: true }
            example:
              nilai:
                - { siswa_id: 101, nilai: 70 }
                - { siswa_id: 102, nilai: null }
      responses:
        '200':
          description: Tersimpan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Sukses'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PenilaianHarian' }
        '400': { $ref: '#/components/responses/InputTidakValid' }
        '401': { $ref: '#/components/responses/BelumLogin' }
        '403': { $ref: '#/components/responses/TidakBerhak' }
        '404': { $ref: '#/components/responses/TidakDitemukan' }
    delete:
      tags: [Input Nilai]
      summary: (baru) Hapus kolom penilaian harian beserta nilainya
      description: Nomor kolom lain tidak digeser (P1, P3 tetap P1, P3).
      x-roles: [guru-mapel]
      responses:
        '200':
          description: Dihapus
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sukses' }
              example: { success: true, message: Penilaian P2 (Kuis 1) dihapus, data: null }
        '401': { $ref: '#/components/responses/BelumLogin' }
        '403': { $ref: '#/components/responses/TidakBerhak' }
        '404': { $ref: '#/components/responses/TidakDitemukan' }

  # =====================================================================
  # BK (student-service). Tidak ada DELETE untuk data BK (K-12).
  # Wali kelas hanya melihat siswa kelas perwaliannya pada tahun ajaran aktif;
  # data siswa di luar itu dijawab 404.
  # =====================================================================
  /api/student/bk/siswa:
    get:
      tags: [BK - Pendukung]
      summary: (baru) Cari siswa aktif untuk form BK
      x-roles: [bk, wali-kelas, kepala-sekolah, waka-sekolah]
      parameters:
        - { name: cari, in: query, required: false, schema: { type: string, maxLength: 100 }, description: Potongan nama atau NISN }
        - $ref: '#/components/parameters/Batas'
        - $ref: '#/components/parameters/Halaman'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Sukses'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/SiswaRingkas' }
        '401': { $ref: '#/components/responses/BelumLogin' }
        '403': { $ref: '#/components/responses/TidakBerhak' }

  /api/student/bk/siswa/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [BK - Pendukung]
      summary: (baru) Profil siswa, data orang tua, dan seluruh catatan BK-nya
      x-roles: [bk, wali-kelas, kepala-sekolah, waka-sekolah]
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Sukses'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/SiswaRingkas'
                          - type: object
                            properties:
                              orang_tua: { type: array, items: { $ref: '#/components/schemas/OrangTua' } }
                              pemanggilan: { type: array, items: { $ref: '#/components/schemas/Pemanggilan' } }
                              pendampingan: { type: array, items: { $ref: '#/components/schemas/Pendampingan' } }
                              pengembalian: { type: array, items: { $ref: '#/components/schemas/Pengembalian' } }
        '401': { $ref: '#/components/responses/BelumLogin' }
        '403': { $ref: '#/components/responses/TidakBerhak' }
        '404': { $ref: '#/components/responses/TidakDitemukan' }

  # ─── Pemanggilan orang tua (PB-01) ──────────────────────────────────
  /api/student/bk/pemanggilan:
    get:
      tags: [BK - Pemanggilan Orang Tua]
      summary: (baru) Riwayat pemanggilan orang tua
      x-roles: [bk, wali-kelas, kepala-sekolah, waka-sekolah]
      parameters:
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/StatusPemanggilan' } }
        - { name: kategori, in: query, required: false, schema: { $ref: '#/components/schemas/KategoriBk' } }
        - $ref: '#/components/parameters/SiswaIdFilter'
        - { name: dari, in: query, required: false, schema: { type: string, format: date } }
        - { name: sampai, in: query, required: false, schema: { type: string, format: date } }
        - $ref: '#/components/parameters/Batas'
        - $ref: '#/components/parameters/Halaman'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuksesBerhalaman'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Pemanggilan' } }
        '400': { $ref: '#/components/responses/InputTidakValid' }
        '401': { $ref: '#/components/responses/BelumLogin' }
        '403': { $ref: '#/components/responses/TidakBerhak' }
    post:
      tags: [BK - Pemanggilan Orang Tua]
      summary: (baru) Buat pemanggilan orang tua
      description: Status awal selalu `dijadwalkan`. Wali kelas hanya untuk siswa kelasnya. Dicatat ke audit log.
      x-roles: [bk, wali-kelas]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PemanggilanRequest' }
            example: { siswa_id: 101, orang_tua_id: 9, nomor_surat: null, tanggal_surat: '2026-11-27', tanggal_panggilan: '2026-12-01', jam: '09:00', tempat: Ruang BK, kategori: kehadiran, alasan: Terlambat 5 kali dalam sebulan }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Sukses'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Pemanggilan' }
        '400':
          description: Input tidak valid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Gagal' }
              examples:
                kategori: { value: { success: false, message: 'kategori harus salah satu dari akademik, kedisiplinan, kehadiran, perilaku, lainnya' } }
                orang_tua: { value: { success: false, message: Orang tua tersebut bukan orang tua siswa ini } }
        '401': { $ref: '#/components/responses/BelumLogin' }
        '403': { $ref: '#/components/responses/TidakBerhak' }
        '404': { $ref: '#/components/responses/TidakDitemukan' }
        '409': { $ref: '#/components/responses/NomorSuratDipakai' }

  /api/student/bk/pemanggilan/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [BK - Pemanggilan Orang Tua]
      summary: (baru) Detail pemanggilan
      x-roles: [bk, wali-kelas, kepala-sekolah, waka-sekolah]
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Sukses'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Pemanggilan' }
        '401': { $ref: '#/components/responses/BelumLogin' }
        '403': { $ref: '#/components/responses/TidakBerhak' }
        '404': { $ref: '#/components/responses/TidakDitemukan' }
    put:
      tags: [BK - Pemanggilan Orang Tua]
      summary: (baru) Ubah pemanggilan / ubah status / isi hasil pertemuan
      description: |
        Kirim hanya kolom yang diubah. Alur status:
        `dijadwalkan` -> `hadir` | `tidak_hadir` | `dijadwal_ulang`;
        `dijadwal_ulang` -> `hadir` | `tidak_hadir` | `dijadwal_ulang`;
        `tidak_hadir` -> `dijadwal_ulang` | `selesai`; `hadir` -> `selesai`.
        `dijadwal_ulang` wajib disertai `tanggal_panggilan` baru. `selesai` wajib punya
        `hasil_pertemuan`; setelah selesai catatan terkunci (409).
        Wali kelas hanya boleh mengubah pemanggilan yang dibuatnya sendiri.
      x-roles: [bk, wali-kelas]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PemanggilanUbahRequest' }
            example: { status: selesai, hasil_pertemuan: 'Orang tua hadir, siswa berjanji tidak terlambat lagi', kesepakatan: Dipantau 2 minggu }
      responses:
        '200':
          description: Tersimpan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Sukses'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Pemanggilan' }
        '400': { $ref: '#/components/responses/InputTidakValid' }
        '401': { $ref: '#/components/responses/BelumLogin' }
        '403': { $ref: '#/components/responses/TidakBerhak' }
        '404': { $ref: '#/components/responses/TidakDitemukan' }
        '409':
          description: Status tidak boleh berpindah begitu, catatan sudah selesai, atau nomor surat sudah dipakai
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Gagal' }
              examples:
                alur: { value: { success: false, message: Status tidak bisa berubah dari dijadwalkan ke selesai } }
                terkunci: { value: { success: false, message: Pemanggilan yang sudah selesai tidak dapat diubah } }

