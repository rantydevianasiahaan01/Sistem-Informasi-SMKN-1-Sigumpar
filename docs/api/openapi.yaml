  # ─── Pengembalian siswa kepada orang tua (PB-03) ────────────────────
  /api/student/bk/pengembalian:
    get:
      tags: [BK - Pengembalian Siswa]
      summary: (baru) Daftar pengajuan pengembalian (yang masih `diajukan` di atas)
      x-roles: [bk, wali-kelas, kepala-sekolah, waka-sekolah]
      parameters:
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/StatusPengembalian' } }
        - { name: jenis, in: query, required: false, schema: { type: string, enum: [sementara, permanen] } }
        - $ref: '#/components/parameters/SiswaIdFilter'
        - $ref: '#/components/parameters/Batas'
        - $ref: '#/components/parameters/Halaman'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuksesBerhalaman'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Pengembalian' } }
        '401': { $ref: '#/components/responses/BelumLogin' }
        '403': { $ref: '#/components/responses/TidakBerhak' }
    post:
      tags: [BK - Pengembalian Siswa]
      summary: (baru) Ajukan pengembalian siswa
      description: |
        Hanya guru BK. `sementara` wajib `tanggal_mulai` dan `tanggal_sampai`;
        `permanen` tidak memakai `tanggal_sampai`. Siswa yang masih punya pengajuan
        `diajukan`/`disetujui` tidak bisa diajukan lagi (409).
        `tanggal_pengajuan` default hari ini.
      x-roles: [bk]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PengembalianRequest' }
            example: { siswa_id: 101, orang_tua_id: 9, jenis: sementara, tanggal_mulai: '2026-12-07', tanggal_sampai: '2026-12-11', alasan: Pelanggaran tata tertib berat, dasar_pertimbangan: Hasil rapat dewan guru }
      responses:
        '201':
          description: Diajukan, menunggu keputusan kepala sekolah
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Sukses'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Pengembalian' }
        '400': { $ref: '#/components/responses/InputTidakValid' }
        '401': { $ref: '#/components/responses/BelumLogin' }
        '403': { $ref: '#/components/responses/TidakBerhak' }
        '404': { $ref: '#/components/responses/TidakDitemukan' }
        '409':
          description: Masih ada pengajuan aktif, atau nomor surat dipakai
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Gagal' }
              example: { success: false, message: Siswa ini masih punya pengembalian berstatus diajukan (id 4) }

  /api/student/bk/pengembalian/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [BK - Pengembalian Siswa]
      summary: (baru) Detail pengembalian
      x-roles: [bk, wali-kelas, kepala-sekolah, waka-sekolah]
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
